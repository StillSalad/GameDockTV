name: Crea APK GameDock TV

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Prepara il progetto
        id: prep
        run: |
          echo "File nel repository:"
          find . -type f -not -path "./.git/*" | head -40
          ZIP=$(find . -iname "*.zip" -not -path "./.git/*" | head -1)
          if [ -n "$ZIP" ]; then
            echo "Trovato: $ZIP"
            mkdir -p progetto && unzip -q -o "$ZIP" -d progetto
          fi
          GRADLE=$(find . -name settings.gradle -not -path "*/build/*" -not -path "./.git/*" | head -1)
          if [ -z "$GRADLE" ]; then
            echo "::error::Progetto non trovato. Carica GameDockTV.zip con Add file > Upload files."
            exit 1
          fi
          echo "dir=$(dirname "$GRADLE")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Strumenti Android (già presenti sulla macchina di GitHub)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > "${{ steps.prep.outputs.dir }}/local.properties"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          fi
          ls "$SDK/platforms"

      - name: Compila l'APK
        working-directory: ${{ steps.prep.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/GameDock-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GameDock-APK
          path: out/*.apk

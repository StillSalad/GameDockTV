name: Crea APK GameDock TV

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepara il progetto
        id: prep
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -1)
          if [ -n "$ZIP" ]; then
            echo "Trovato: $ZIP"
            mkdir -p progetto && unzip -q -o "$ZIP" -d progetto
          fi
          GRADLE=$(find . -name settings.gradle -not -path "*/build/*" | head -1)
          if [ -z "$GRADLE" ]; then
            echo "::error::Progetto non trovato. Carica GameDockTV.zip con Add file > Upload files."
            exit 1
          fi
          echo "dir=$(dirname "$GRADLE")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Compila l'APK
        working-directory: ${{ steps.prep.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/GameDock-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GameDock-APK
          path: out/*.apk
